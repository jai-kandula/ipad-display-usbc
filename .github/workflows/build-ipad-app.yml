name: Build iPad app

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/build-ipad-app.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          xcodebuild \
            -project IPadDisplay.xcodeproj \
            -scheme IPadDisplay \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/IPadDisplay.app Payload/
          zip -qry ../IPadDisplay.ipa Payload
          ls -la ../IPadDisplay.ipa

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPadDisplay-ipa
          path: IPadDisplay.ipa

      - name: Publish to the "latest" release (easy download link)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: iPad Display app (latest build)
          body: Download IPadDisplay.ipa below and install it with Sideloadly. See USB-C.md.
          files: IPadDisplay.ipa
          make_latest: true
